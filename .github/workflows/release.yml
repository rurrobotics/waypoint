name: Release

on:
  push:
    tags: ["v*"]
  # Manual runs build and upload artifacts but don't publish a release.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 keeps the glibc requirement low so the binary runs on older distros.
          - { runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu, test: true }
          - { runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, test: true }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc, test: true }
          - { runner: macos-latest, target: aarch64-apple-darwin, test: true }
          # Cross-compiled on the Apple Silicon runner.
          - { runner: macos-latest, target: x86_64-apple-darwin, test: false }
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb1-dev libxcb-xkb-dev libx11-xcb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libvulkan-dev libfontconfig-dev libfreetype-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Test
        if: matrix.test
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          name="waypoint-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ "$RUNNER_OS" = "Windows" ]; then exe=waypoint.exe; else exe=waypoint; fi
          cp "target/${{ matrix.target }}/release/$exe" "dist/$name/"
          cp README.md LICENSE* "dist/$name/" 2>/dev/null || true
          # Embedded fonts (OFL) and icons (ISC) require their licences to ship with the binary.
          mkdir -p "dist/$name/licenses"
          cp assets/fonts/OFL-*.txt assets/icons/LICENSE-lucide.txt "dist/$name/licenses/"
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            archive="$name.zip"
            7z a -tzip "$archive" "$name" > /dev/null
          else
            archive="$name.tar.gz"
            tar -czf "$archive" "$name"
          fi
          if command -v sha256sum > /dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/${{ env.ARCHIVE }}
            dist/${{ env.ARCHIVE }}.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          # v1.0.0-rc1 and similar are prereleases.
          prerelease: ${{ contains(github.ref_name, '-') }}
