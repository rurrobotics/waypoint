[package]
name = "waypoint"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
gpui = "0.2.2"
# Keep resvg on the same version as gpui (0.45) so there is only one copy;
# used to render SVG table backgrounds at a chosen size.
image = { version = "0.25.10", default-features = false }
resvg = { version = "0.45", default-features = false, features = ["text"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"

# Workaround: gpui 0.2.2 -> zed-async-tar -> xattr 0.2.3 uses libc::ENOATTR,
# which libc removed on Linux in 0.2.190. Drop this once gpui is updated.
libc = ">=0.2, <0.2.190"

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }
